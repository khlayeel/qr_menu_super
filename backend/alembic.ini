[alembic]
# chemin vers le dossier contenant les scripts de migration
script_location = alembic

# gabarit pour les noms de fichiers de migration
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# fuseau horaire (laisser vide = UTC/local)

# URL de la base — remplacée dynamiquement dans env.py par settings.DATABASE_URL,
# cette ligne n'est qu'un placeholder requis par Alembic
sqlalchemy.url = mysql+pymysql://root:password@localhost:3306/qr_menu_db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s